name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, bundles: nsis }
          - { name: macos-arm64, os: macos-latest, bundles: "app,dmg" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build app and installer
        working-directory: crates/app
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/bundle/nsis/*.exe dist/
            cp target/release/mono-sync.exe dist/mono-sync-portable-windows-x64.exe
          else
            cp target/release/bundle/dmg/*.dmg dist/
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: mono-sync-${{ matrix.name }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: true
