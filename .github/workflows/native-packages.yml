name: Native packages

on:
  push:
    branches:
      - codex/deskflow-rebuild
    paths-ignore:
      - docs/**
      - .rps/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-2022
            arch: amd64
            qt-version: 6.11.3
            vcpkg-triplet: x64-windows-release
            config-args: ''
          - name: macos-arm64
            os: macos-15
            qt-version: 6.11.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install pinned upstream dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSKIP_BUILD_TESTS=ON
          -DPACKAGE_VERSION_LABEL=1.27.0-monosync
          ${{ matrix.target.config-args }}
          ${{ steps.get-deps.outputs.vcpkg-cmake-config }}

      - name: Build all targets
        shell: bash
        run: cmake --build build --config Release --parallel 8

      - name: Run upstream unit tests
        shell: bash
        run: ctest --test-dir build/src/unittests -C Release --output-on-failure --timeout 120

      - name: Package macOS with transient DMG retry
        if: runner.os == 'macOS'
        shell: bash
        run: |
          packaged=false
          for i in $(seq 1 5); do
            if cmake --build build --config Release --parallel 8 --target package; then
              packaged=true
              break
            fi
            echo "Package attempt $i failed"
            sleep 1
          done
          if [[ "$packaged" != true ]]; then
            echo "Packaging failed after $i attempts" >&2
            exit 1
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --build build --config Release --parallel 8 --target package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mono-sync-${{ matrix.target.name }}
          path: build/deskflow-*.*
          if-no-files-found: error
          retention-days: 14
