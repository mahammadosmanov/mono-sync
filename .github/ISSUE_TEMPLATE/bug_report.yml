name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: mono-sync version or commit }
    validations: { required: true }
  - type: input
    id: oses
    attributes: { label: Host OS and guest OS (with versions) }
    validations: { required: true }
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Wired, Wi-Fi, Mixed, Other]
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, expected and actual behaviour }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens and anything typed. Never paste pairing codes.
