[package]
name = "mono-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mono"
path = "src/main.rs"

[dependencies]
mono-core = { path = "../core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
